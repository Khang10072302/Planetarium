<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Planetarium — Pixel Planet Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-void:#0a0b12;
    --bg-panel:#13141f;
    --bg-panel-2:#1a1c2a;
    --bg-panel-3:#202233;
    --ink-primary:#e8e6f0;
    --ink-muted:#666b82;
    --ink-dim:#3f4356;
    --accent-gold:#e8c468;
    --accent-violet:#9d8cf0;
    --line:#242637;
    --danger:#d97a6a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg-void);overflow:hidden;}
  body{
    font-family:'Space Mono', monospace;
    color:var(--ink-primary);
    display:flex; justify-content:center;
    height:100vh; height:100dvh;
  }
  #starfield{position:fixed; inset:0; z-index:0; display:block;}

  .app{
    position:relative; z-index:1;
    width:100%; max-width:440px;
    height:100%;
    display:flex; flex-direction:column; align-items:center;
    padding:0 16px;
  }

  .fixed-top{ flex:0 0 auto; width:100%; display:flex; flex-direction:column; align-items:center; padding-top:20px; }
  .scroll-area{ flex:1 1 auto; width:100%; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:36px; }

  header{ text-align:center; margin-bottom:16px; }
  h1{
    font-family:'Silkscreen', monospace;
    font-size:20px; letter-spacing:3px; margin:0;
    color:var(--accent-gold);
    text-shadow:0 0 12px rgba(232,196,104,0.25);
  }
  .subtitle{
    margin:6px 0 0; font-size:11px; letter-spacing:2px;
    color:var(--ink-muted); text-transform:uppercase;
  }

  .stage-window{
    position:relative;
    width:100%; aspect-ratio:1/1; max-width:360px;
    background:radial-gradient(circle at 50% 42%, var(--bg-panel-2), var(--bg-panel) 72%);
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
    margin-bottom:18px;
    display:flex; align-items:center; justify-content:center;
  }
  #planetCanvas{ display:block; image-rendering:pixelated; image-rendering:-moz-crisp-edges; image-rendering:crisp-edges; }
  #meteorCanvas{
    position:absolute; inset:0; width:100%; height:100%;
    pointer-events:none; display:none;
    image-rendering:pixelated; image-rendering:-moz-crisp-edges; image-rendering:crisp-edges;
  }
  body.focus-mode #meteorCanvas{ display:block; }
  .seed-tag{
    position:absolute; top:10px; left:12px;
    font-size:10px; letter-spacing:1px; color:var(--ink-dim);
    pointer-events:none;
  }
  .stage-label{
    position:absolute; bottom:10px; left:12px; right:12px;
    display:flex; justify-content:space-between; align-items:baseline;
    font-family:'Silkscreen', monospace;
    font-size:11px; letter-spacing:2px; color:var(--ink-muted);
    text-transform:uppercase; pointer-events:none;
  }
  .stage-label b{ color:var(--accent-violet); font-weight:400; }
  .stage-label span{ font-family:'Space Mono',monospace; font-size:10px; letter-spacing:0; color:var(--ink-dim); text-transform:none; }

  .focus-toggle{
    position:absolute; top:8px; right:10px; width:28px; height:28px;
    border-radius:6px; background:rgba(10,11,18,0.45); border:1px solid var(--line);
    color:var(--ink-muted); font-size:14px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; z-index:3;
  }
  .meteor-btn{
    display:none;
    position:absolute; top:8px; right:44px; width:28px; height:28px;
    border-radius:6px; background:rgba(10,11,18,0.45); border:1px solid var(--line);
    color:var(--ink-muted); font-size:14px; align-items:center; justify-content:center;
    cursor:pointer; z-index:3;
  }
  body.focus-mode .meteor-btn{ display:flex; position:fixed; top:16px; right:58px; z-index:20; background:rgba(12,13,20,0.7); color:var(--ink-primary); }
  .exit-focus{
    position:fixed; top:16px; right:16px; z-index:20;
    width:34px; height:34px; border-radius:50%;
    background:rgba(12,13,20,0.7); border:1px solid var(--line); color:var(--ink-primary);
    font-size:16px; display:none; align-items:center; justify-content:center; cursor:pointer;
  }

  body.focus-mode .app{ padding:0; max-width:none; width:100vw; height:100vh; justify-content:center; }
  body.focus-mode .fixed-top{ padding-top:0; height:100%; }
  body.focus-mode header, body.focus-mode .scroll-area, body.focus-mode .focus-toggle{ display:none; }
  body.focus-mode .stage-window{ position:fixed; inset:0; max-width:none; width:100vw; height:100vh; aspect-ratio:auto; border:none; border-radius:0; margin:0; top:0; background:transparent; }
  body.focus-mode .exit-focus{ display:flex; }

  .zoom-control{
    position:fixed; top:58px; right:16px; width:110px; z-index:20;
    display:none; background:rgba(12,13,20,0.55); padding:8px 9px;
    border-radius:8px; border:1px solid var(--line);
  }
  body.focus-mode .zoom-control{ display:block; }
  .zoom-control .zoom-value{ font-size:9px; letter-spacing:1px; color:var(--ink-muted); text-align:center; margin-bottom:4px; }

  .controls{ width:100%; max-width:360px; margin:0 auto; display:flex; flex-direction:column; gap:12px; }
  .row{ display:flex; gap:8px; }

  .seed-row input{
    flex:1; min-width:0;
    background:var(--bg-panel); border:1px solid var(--line); border-radius:6px;
    color:var(--ink-primary); font-family:'Space Mono',monospace; font-size:13px;
    padding:11px 12px; outline:none; letter-spacing:1px;
  }
  .seed-row input::placeholder{ color:var(--ink-dim); }
  .seed-row input:focus{ border-color:var(--accent-gold); }
  .icon-btn{
    width:42px; flex-shrink:0;
    background:var(--bg-panel); border:1px solid var(--line); border-radius:6px;
    color:var(--accent-gold); font-size:17px; cursor:pointer;
  }
  .icon-btn:active{ background:var(--bg-panel-2); }

  .stage-tabs{ gap:6px; }
  .stage-tab{
    flex:1; padding:10px 0; text-align:center;
    background:var(--bg-panel); border:1px solid var(--line); border-radius:6px;
    color:var(--ink-muted); font-family:'Silkscreen',monospace; font-size:12px;
    letter-spacing:1px; cursor:pointer;
  }
  .stage-tab.active{
    color:var(--accent-violet); border-color:var(--accent-violet);
    background:rgba(157,140,240,0.08);
  }

  .spin-row{ align-items:center; gap:8px; }
  .spin-label{ font-size:10px; letter-spacing:1.5px; color:var(--ink-muted); flex:1; }
  .spin-btn{
    width:38px; height:32px; background:var(--bg-panel); border:1px solid var(--line);
    border-radius:6px; color:var(--ink-primary); font-size:15px; cursor:pointer;
  }
  .spin-btn.active{ border-color:var(--accent-gold); color:var(--accent-gold); }

  .panel{ background:var(--bg-panel); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .panel-head{ display:flex; align-items:center; gap:8px; padding:10px 12px; }
  .panel-head .title{ font-family:'Silkscreen',monospace; font-size:11px; letter-spacing:1.5px; color:var(--ink-muted); flex:1; }
  .panel-head .count{ font-size:10px; color:var(--ink-dim); }
  .mini-toggle{
    width:15px; height:15px; border-radius:4px; border:1px solid var(--line);
    background:var(--bg-panel-2); cursor:pointer; flex-shrink:0;
  }
  .mini-toggle.on{ background:var(--accent-gold); border-color:var(--accent-gold); }
  .add-btn{
    width:24px; height:24px; border-radius:6px; border:1px dashed var(--ink-dim);
    background:transparent; color:var(--ink-muted); font-size:15px; line-height:1; cursor:pointer; flex-shrink:0;
  }
  .add-btn:active{ background:var(--bg-panel-2); }

  .item-list{ border-top:1px solid var(--line); }
  .item-row{ display:flex; align-items:center; gap:10px; padding:9px 12px; cursor:pointer; border-bottom:1px solid var(--line); }
  .item-row:last-child{ border-bottom:none; }
  .swatch{ width:14px; height:14px; border-radius:50%; flex-shrink:0; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.15); }
  .item-name{ font-size:11px; letter-spacing:0.5px; color:var(--ink-primary); flex:1; }
  .item-meta{ font-size:9px; color:var(--ink-dim); }
  .item-del{ color:var(--danger); font-size:14px; padding:2px 4px; cursor:pointer; flex-shrink:0; }
  .item-editor{ padding:10px 12px 14px; background:var(--bg-panel-3); border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:10px; }
  .field{ display:flex; flex-direction:column; gap:4px; }
  .field-label{ display:flex; justify-content:space-between; font-size:9px; letter-spacing:1px; color:var(--ink-muted); text-transform:uppercase; }
  .field-label span{ color:var(--ink-dim); }
  input[type=range]{ -webkit-appearance:none; width:100%; height:14px; background:transparent; margin:0; }
  input[type=range]::-webkit-slider-runnable-track{ height:4px; border-radius:2px; background:var(--line); }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:13px; height:13px; margin-top:-4.5px; border-radius:50%;
    background:var(--ink-primary); border:2px solid var(--bg-void); cursor:pointer;
  }
  input[type=range].hue-slider::-webkit-slider-runnable-track{
    background:linear-gradient(to right, red, yellow, lime, cyan, blue, magenta, red);
    height:6px; border-radius:3px;
  }
  .dir-row{ display:flex; gap:6px; }
  .dir-btn{ flex:1; padding:6px 0; font-size:11px; text-align:center; border-radius:5px; background:var(--bg-panel-2); border:1px solid var(--line); color:var(--ink-muted); cursor:pointer; }
  .dir-btn.active{ border-color:var(--accent-violet); color:var(--accent-violet); }
  .empty-hint{ padding:12px; font-size:10px; color:var(--ink-dim); text-align:center; letter-spacing:0.5px; }
</style>
</head>
<body>

<canvas id="starfield"></canvas>
<button class="exit-focus" id="exitFocusBtn" title="Exit">✕</button>
<div class="zoom-control" id="zoomControl">
  <div class="zoom-value" id="zoomValue">100%</div>
  <input type="range" id="zoomSlider" min="0" max="200" step="5" value="100">
</div>

<div class="app">
  <div class="fixed-top">
    <header>
      <h1>PLANETARIUM</h1>
      <p class="subtitle">pixel planet generator</p>
    </header>

    <div class="stage-window">
      <span class="seed-tag" id="seedTag">—</span>
      <button class="focus-toggle" id="focusToggleBtn" title="Focus view (planet only)">⛶</button>
      <button class="meteor-btn" id="meteorBtn" title="Launch meteor">☄</button>
      <canvas id="planetCanvas" width="380" height="380"></canvas>
      <canvas id="meteorCanvas"></canvas>
      <div class="stage-label">
        <b id="stageName">BARREN</b>
        <span id="stageSub">asteroid craters</span>
      </div>
    </div>
  </div>

  <div class="scroll-area">
  <div class="controls">
    <div class="row seed-row">
      <input id="seedInput" type="text" placeholder="Enter a seed, e.g. Rigel-b" maxlength="24" spellcheck="false" autocomplete="off">
      <button id="randomBtn" class="icon-btn" title="Random">⟳</button>
    </div>

    <div class="row stage-tabs">
      <button class="stage-tab active" data-stage="0">I</button>
      <button class="stage-tab" data-stage="1">II</button>
      <button class="stage-tab" data-stage="2">III</button>
      <button class="stage-tab" data-stage="3">IV</button>
    </div>

    <div class="panel">
      <div class="panel-head" id="planetPanelHead" style="cursor:pointer;">
        <div class="title">PLANET</div>
        <div class="count" id="planetChevron">▾</div>
      </div>
      <div class="item-editor" id="planetEditor" style="display:none;"></div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <div class="mini-toggle" id="moonMasterToggle" title="Show/hide moons"></div>
        <div class="title">MOONS</div>
        <div class="count" id="moonCount">0</div>
        <button class="add-btn" id="addMoonBtn">+</button>
      </div>
      <div class="item-list" id="moonList"></div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <div class="mini-toggle" id="ringMasterToggle" title="Show/hide rings"></div>
        <div class="title">RINGS</div>
        <div class="count" id="ringCount">0</div>
        <button class="add-btn" id="addRingBtn">+</button>
      </div>
      <div class="item-list" id="ringList"></div>
    </div>

    <div class="row" style="justify-content:center;font-size:10px;letter-spacing:1px;color:var(--ink-dim);">
      seed <b id="seedNum" style="color:var(--ink-muted);font-weight:400;margin-left:4px;">0</b>
    </div>
  </div>
  </div>
</div>

<script>
/* ============================= PRNG & NOISE ============================= */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hashStringToSeed(str){
  let h = 1779033703 ^ str.length;
  for(let i=0;i<str.length;i++){
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  h = Math.imul(h ^ (h>>>16), 2246822507);
  h = Math.imul(h ^ (h>>>13), 3266489909);
  return (h ^ (h>>>16)) >>> 0;
}
function buildPerlin(rand){
  const p = new Uint8Array(256);
  for(let i=0;i<256;i++) p[i]=i;
  for(let i=255;i>0;i--){ const j=Math.floor(rand()*(i+1)); const t=p[i]; p[i]=p[j]; p[j]=t; }
  const perm = new Uint8Array(512);
  for(let i=0;i<512;i++) perm[i]=p[i&255];
  function fade(t){ return t*t*t*(t*(t*6-15)+10); }
  function lerp(t,a,b){ return a+t*(b-a); }
  function grad(hash,x,y,z){
    const h=hash&15;
    const u=h<8?x:y;
    const v=h<4?y:(h===12||h===14?x:z);
    return (((h&1)===0)?u:-u)+(((h&2)===0)?v:-v);
  }
  return function(x,y,z){
    const X=Math.floor(x)&255, Y=Math.floor(y)&255, Z=Math.floor(z)&255;
    x-=Math.floor(x); y-=Math.floor(y); z-=Math.floor(z);
    const u=fade(x), v=fade(y), w=fade(z);
    const A=perm[X]+Y, AA=perm[A]+Z, AB=perm[A+1]+Z;
    const B=perm[X+1]+Y, BA=perm[B]+Z, BB=perm[B+1]+Z;
    return lerp(w,
      lerp(v, lerp(u, grad(perm[AA],x,y,z),     grad(perm[BA],x-1,y,z)),
              lerp(u, grad(perm[AB],x,y-1,z),   grad(perm[BB],x-1,y-1,z))),
      lerp(v, lerp(u, grad(perm[AA+1],x,y,z-1), grad(perm[BA+1],x-1,y,z-1)),
              lerp(u, grad(perm[AB+1],x,y-1,z-1),grad(perm[BB+1],x-1,y-1,z-1)))
    );
  };
}
function fbm(perlin,x,y,z,octaves,lac,gain){
  let amp=0.5, freq=1, sum=0, norm=0;
  for(let o=0;o<octaves;o++){
    sum += amp*perlin(x*freq,y*freq,z*freq);
    norm += amp;
    amp*=gain; freq*=lac;
  }
  return (sum/norm)*0.5+0.5;
}
function ridged(perlin,x,y,z,octaves){
  let amp=0.5, freq=1, sum=0, norm=0;
  for(let o=0;o<octaves;o++){
    let n = perlin(x*freq,y*freq,z*freq);
    n = 1-Math.abs(n);
    sum += amp*n*n;
    norm += amp;
    amp*=0.5; freq*=2.3;
  }
  return sum/norm;
}
function hash3(x,y,z,seed){
  let n = Math.sin(x*127.1+y*311.7+z*74.7+seed*0.0001)*43758.5453;
  return n-Math.floor(n);
}
function randomSpherePoint(rng){
  const u=rng(), v=rng();
  const theta=2*Math.PI*u, phi=Math.acos(2*v-1);
  return [Math.sin(phi)*Math.cos(theta), Math.cos(phi), Math.sin(phi)*Math.sin(theta)];
}
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function smoothstep(a,b,x){ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); }
function mixC(c1,c2,t){ return [c1[0]+(c2[0]-c1[0])*t, c1[1]+(c2[1]-c1[1])*t, c1[2]+(c2[2]-c1[2])*t]; }
function hslToRgb(h,s,l){
  h=((h%360)+360)%360; s=clamp(s,0,1); l=clamp(l,0,1);
  const c=(1-Math.abs(2*l-1))*s;
  const x=c*(1-Math.abs((h/60)%2-1));
  const m=l-c/2;
  let r=0,g=0,b=0;
  if(h<60){r=c;g=x;b=0;} else if(h<120){r=x;g=c;b=0;} else if(h<180){r=0;g=c;b=x;}
  else if(h<240){r=0;g=x;b=c;} else if(h<300){r=x;g=0;b=c;} else {r=c;g=0;b=x;}
  return [Math.round((r+m)*255), Math.round((g+m)*255), Math.round((b+m)*255)];
}
function rgbCss(c){ return `rgb(${c[0]|0},${c[1]|0},${c[2]|0})`; }
function rgbaCss(c,a){ return `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`; }

const BAYER4 = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
function ditherMul(value,i,j,levels){
  const threshold=(BAYER4[j&3][i&3]+0.5)/16;
  const scaled=value*levels;
  const base=Math.floor(scaled);
  const frac=scaled-base;
  const level=frac>threshold?base+1:base;
  return Math.min(levels,level)/levels;
}
// light comes from front-right, giving the mostly-vertical terminator seen in the reference art
const LIGHT = (()=>{ const v=[0.82,0.12,0.45]; const m=Math.hypot(v[0],v[1],v[2]); return [v[0]/m,v[1]/m,v[2]/m]; })();
function dayFactorOf(raw){ return smoothstep(-0.35, 0.55, raw); }

/* ============================= PALETTES (tuned to reference screenshots) ============================= */
const CLOUD_DAY = [242,238,222];
const CLOUD_NIGHT = [62,66,84];

/* ============================= WORD-LIKE SEED NAMES ============================= */
const SYLL_A = ['Al','Rig','Vex','Ka','Ny','Tho','Or','Sel','Mar','Zu','Fen','Cor','Ith','Dra','Wen'];
const SYLL_B = ['pherg','el','ora','lith','ven','ax','os','ari','und','esh','ion','ath','yr','ael','oth'];
const SUFFIX = ['b','c','d','e','II','III','IV','V'];
function randomSeedName(){
  const a = SYLL_A[Math.floor(Math.random()*SYLL_A.length)];
  const b = SYLL_B[Math.floor(Math.random()*SYLL_B.length)];
  const s = SUFFIX[Math.floor(Math.random()*SUFFIX.length)];
  return a+b+' '+s;
}
let idCounter=1;
function nextId(){ return (idCounter++).toString(36); }

/* ============================= STATE ============================= */
const STAGE_NAMES = [['BARREN','asteroid craters'], ['MOLTEN','lava'], ['ALIVE','signature colors'], ['INHABITED','clouds & night lights']];
const N = 110;

let state = {
  seedStr:'', baseSeed:0,
  perlinT:null,
  craters:[], clouds:[],
  pal:null,
  moons:[], rings:[],
  moonsEnabled:true, ringsEnabled:true,
  stageTarget:0, stageAnim:0,
  rotation:0, spinDir:1, spinSpeed:0.11,
  planetSizeMul:1.0, axisTiltDeg:0, cloudDensityMul:1.0,
  openMoonId:null, openRingId:null, planetPanelOpen:false,
  meteors:[], zoomScale:1
};

function rebuildPalette(waterHue, landHue, seaLevel){
  state.pal = {
    seaLevel, waterHue, landHue,
    deepSea: hslToRgb(waterHue, 0.55, 0.26),
    shallowSea: hslToRgb(waterHue, 0.62, 0.62),
    lowland: hslToRgb(landHue, 0.55, 0.68),
    midland: hslToRgb(landHue+18, 0.55, 0.48),
    highland: hslToRgb(landHue-25, 0.30, 0.50),
    peak: hslToRgb(landHue, 0.12, 0.90)
  };
}

function regenerateClouds(){
  const rng = mulberry32((state.baseSeed ^ 0x51ed270b) >>> 0);
  const cloudCount = Math.max(0, Math.round((5+rng()*5)*state.cloudDensityMul));
  state.clouds = [];
  for(let i=0;i<cloudCount;i++){
    const p = randomSpherePoint(rng);
    const size = 0.085+rng()*0.06;
    const parts = [];
    const partCount = 10+Math.floor(rng()*7);
    for(let k=0;k<partCount;k++){
      parts.push({ dx:(rng()-0.5)*0.9, dy:(rng()-0.5)*0.55, r:0.42+rng()*0.42 });
    }
    state.clouds.push({p, size, parts});
  }
}

function generatePlanet(seedStr){
  state.seedStr = seedStr;
  state.baseSeed = hashStringToSeed(seedStr);
  const rng = mulberry32(state.baseSeed);
  state.perlinT = buildPerlin(mulberry32(state.baseSeed ^ 0x9e3779b9));

  const craterCount = 6+Math.floor(rng()*8);
  state.craters = [];
  for(let i=0;i<craterCount;i++) state.craters.push({ c: randomSpherePoint(rng), r: 0.06+rng()*0.14 });

  state.cloudDensityMul = 1.0;
  regenerateClouds();

  const waterHue = Math.floor(rng()*360);
  const landHue = Math.floor((waterHue+120+rng()*120)%360);
  const seaLevel = clamp(0.16+rng()*0.4, 0.1, 0.62);
  rebuildPalette(waterHue, landHue, seaLevel);

  state.planetSizeMul = 1.0;
  state.spinSpeed = 0.07+rng()*0.12;
  state.axisTiltDeg = Math.round((rng()-0.5)*50);

  state.moons = [];
  const moonRoll = rng();
  const moonCount = moonRoll<0.4?0:(moonRoll<0.78?1:2);
  for(let i=0;i<moonCount;i++) state.moons.push(makeMoon(rng, 1.35+i*0.35+rng()*0.15));

  state.rings = [];
  const ringRoll = rng();
  const ringCount = ringRoll<0.6?0:(ringRoll<0.92?1:2);
  for(let i=0;i<ringCount;i++) state.rings.push(makeRing(rng, 1.3+i*0.28+rng()*0.12));

  state.moonsEnabled = state.moons.length>0;
  state.ringsEnabled = state.rings.length>0;
  state.openMoonId = null; state.openRingId = null;

  document.getElementById('seedTag').textContent = seedStr;
  document.getElementById('seedNum').textContent = state.baseSeed.toString(36);
  syncUI();
}

function makeMoon(rng, dist){
  return { id: nextId(), dist: clamp(dist,1.15,8.0), size: 0.10+rng()*0.10, speed: 0.10+rng()*0.22, dir: rng()<0.5?1:-1, hue: Math.floor(rng()*360), phase: rng()*Math.PI*2, orbitTiltDeg: 20+rng()*50, zTiltDeg: Math.round((rng()-0.5)*50) };
}
function makeRing(rng, dist){
  const ring = { id: nextId(), dist: clamp(dist,1.15,6.0), width: 0.10+rng()*0.16, speed: 0.05+rng()*0.18, dir: rng()<0.5?1:-1, hue: Math.floor(rng()*360), phase: rng()*Math.PI*2, orbitTiltDeg: 20+rng()*45, zTiltDeg: Math.round((rng()-0.5)*50), density: 1.0+rng()*0.6, particles:[] };
  regenerateRingParticles(ring);
  return ring;
}
function regenerateRingParticles(ring){
  const rng = mulberry32(hashStringToSeed(ring.id+'_ringparts'));
  const count = Math.max(12, Math.round(70*ring.density));
  ring.particles = [];
  for(let i=0;i<count;i++){
    ring.particles.push({
      a: rng()*Math.PI*2,
      rT: rng(),
      size: 0.55+rng()*0.9,
      shape: rng()<0.32 ? 1 : 0,
      tone: Math.floor(rng()*3)
    });
  }
}

const pctx = planetCanvas.getContext('2d');
const off = document.createElement('canvas'); off.width=N; off.height=N;
const octx = off.getContext('2d');
const imgData = octx.createImageData(N,N);

/* ============================= TERRAIN RENDER ============================= */
function craterShade(rx,ry,rz,craters){
  let shade=1.0, rim=0;
  for(let k=0;k<craters.length;k++){
    const c=craters[k].c, rad=craters[k].r;
    const dot = rx*c[0]+ry*c[1]+rz*c[2];
    if(dot>0.5){
      const ang = Math.acos(clamp(dot,-1,1));
      if(ang < rad*1.5){
        const t = ang/rad;
        if(t<0.75){ const d = 0.5+0.5*(t/0.75); shade = Math.min(shade, d); }
        else if(t<1.15){ rim = Math.max(rim, smoothstep(0.75,0.95,t)*smoothstep(1.15,0.95,t)*0.35); }
      }
    }
  }
  return clamp(shade+rim,0.35,1.25);
}

function colorAtStage(stage, e, ridgedV, crater, dayFactor, pal, isNightLight, i, j){
  if(stage===0){
    let base = mixC([26,26,36],[112,116,140], e*0.5+0.2);
    base = base.map(v=>v*crater);
    const shadeMul = ditherMul(clamp(0.28+0.72*dayFactor,0,1), i, j, 6);
    return base.map(v=>v*shadeMul);
  }
  if(stage===1){
    const rock = mixC([20,15,17],[42,32,29], e*0.4+crater*0.15);
    const veinT = smoothstep(0.5,0.72,ridgedV);
    const hotT = smoothstep(0.74,0.94,ridgedV);
    const lava = mixC([120,32,16], mixC([220,95,28],[255,206,120],hotT), Math.min(1,veinT+hotT));
    let base = mixC(rock, lava, veinT);
    const rockShade = ditherMul(clamp(0.26+0.74*dayFactor,0,1), i, j, 6);
    const glow = rockShade + veinT*(1-rockShade)*0.9;
    return [base[0]*glow, base[1]*glow, base[2]*glow];
  }
  let base;
  if(e < pal.seaLevel){
    const t = e/Math.max(0.001,pal.seaLevel);
    base = mixC(pal.deepSea, pal.shallowSea, t);
  } else {
    const t = (e-pal.seaLevel)/(1-pal.seaLevel);
    if(t<0.55) base = mixC(pal.lowland, pal.midland, t/0.55);
    else if(t<0.85) base = mixC(pal.midland, pal.highland, (t-0.55)/0.3);
    else base = mixC(pal.highland, pal.peak, (t-0.85)/0.15);
  }
  base = mixC(base, base.map(v=>v*crater), 0.25);
  const shadeMul = ditherMul(clamp(0.22+0.78*dayFactor,0,1), i, j, 6);
  let shaded = base.map(v=>v*shadeMul);
  if(stage===3 && isNightLight) shaded = [255,222,160];
  return shaded;
}

function renderSphere(){
  const data = imgData.data;
  const rot = state.rotation;
  const cosR=Math.cos(rot), sinR=Math.sin(rot);

  const s0 = Math.min(3, Math.floor(state.stageAnim));
  const s1 = Math.min(3, s0+1);
  const frac = state.stageAnim - s0;
  const pal = state.pal;
  const half = N/2;
  const tiltR = state.axisTiltDeg*Math.PI/180;
  const cosT=Math.cos(tiltR), sinT=Math.sin(tiltR);

  for(let j=0;j<N;j++){
    for(let i=0;i<N;i++){
      const idx=(j*N+i)*4;
      const nx=(i+0.5-half)/half, ny=(j+0.5-half)/half;
      const d2=nx*nx+ny*ny;
      if(d2>1){ data[idx+3]=0; continue; }
      const nz=Math.sqrt(1-d2);

      const tnx = nx*cosT - ny*sinT;
      const tny = nx*sinT + ny*cosT;
      const rx = tnx*cosR+nz*sinR;
      const rz = -tnx*sinR+nz*cosR;
      const ry = tny;

      const e = fbm(state.perlinT, rx*1.9+4.1, ry*1.9+1.7, rz*1.9+8.3, 3, 2.0, 0.46);
      const ridgedV = ridged(state.perlinT, rx*3.2-9.4, ry*3.2+2.2, rz*3.2+5.6, 3);
      const crater = craterShade(rx,ry,rz, state.craters);

      const raw = nx*LIGHT[0]+ny*LIGHT[1]+nz*LIGHT[2];
      const dayFactor = dayFactorOf(raw);

      let isNightLight=false;
      if(dayFactor<0.4 && e>=pal.seaLevel){
        const freq=30;
        const h = hash3(Math.floor(rx*freq),Math.floor(ry*freq),Math.floor(rz*freq), state.baseSeed);
        isNightLight = h>0.978;
      }

      const c0 = colorAtStage(s0, e, ridgedV, crater, dayFactor, pal, isNightLight, i, j);
      let rC,gC,bC;
      if(s0===s1){ rC=c0[0]; gC=c0[1]; bC=c0[2]; }
      else{
        const c1 = colorAtStage(s1, e, ridgedV, crater, dayFactor, pal, isNightLight, i, j);
        rC = c0[0]+(c1[0]-c0[0])*frac;
        gC = c0[1]+(c1[1]-c0[1])*frac;
        bC = c0[2]+(c1[2]-c0[2])*frac;
      }
      data[idx]  = clamp(rC,0,255);
      data[idx+1]= clamp(gC,0,255);
      data[idx+2]= clamp(bC,0,255);
      data[idx+3]= 255;
    }
  }
  octx.putImageData(imgData,0,0);
}

/* ============================= SPRITES: rings / moons / clouds ============================= */
function ringTones(hue){
  return [
    hslToRgb(hue, 0.32, 0.70),
    hslToRgb(hue+38, 0.28, 0.42),
    hslToRgb(hue-32, 0.14, 0.86)
  ];
}
function drawRings(cx,cy,R,front){
  for(const ring of state.rings){
    const squish = Math.sin(ring.orbitTiltDeg*Math.PI/180);
    const zR = ring.zTiltDeg*Math.PI/180;
    const cosZ=Math.cos(zR), sinZ=Math.sin(zR);
    const rOuter = R*ring.dist, rInner = R*(ring.dist-ring.width);
    const tones = ringTones(ring.hue);
    for(const p of ring.particles){
      const a = p.a + ring.phase;
      const isFront = Math.sin(a) >= 0;
      if(isFront !== front) continue;
      const rr = rInner + p.rT*(rOuter-rInner);
      const dx0 = Math.cos(a)*rr;
      const dy0 = Math.sin(a)*rr*squish;
      const dx = dx0*cosZ - dy0*sinZ;
      const dy = dx0*sinZ + dy0*cosZ;
      const x = cx + dx;
      const y = cy + dy;
      const sz = Math.max(1.4, R*0.055*p.size);
      pctx.fillStyle = rgbCss(tones[p.tone]);
      if(p.shape===0){
        pctx.fillRect(x-sz/2, y-sz/2, sz, sz);
      } else {
        const arm = sz*0.42;
        pctx.fillRect(x-arm/2, y-sz/2, arm, sz);
        pctx.fillRect(x-sz/2, y-arm/2, sz, arm);
      }
    }
  }
}
function drawMoonOrbit(cx,cy,R,m){
  const squish = Math.sin(m.orbitTiltDeg*Math.PI/180);
  const zR = m.zTiltDeg*Math.PI/180;
  const cosZ=Math.cos(zR), sinZ=Math.sin(zR);
  const orbR = R*m.dist;
  const steps = 96;
  pctx.beginPath();
  for(let s=0;s<=steps;s++){
    const a = (s/steps)*Math.PI*2;
    const dx0 = Math.cos(a)*orbR;
    const dy0 = Math.sin(a)*orbR*squish;
    const x = cx + dx0*cosZ - dy0*sinZ;
    const y = cy + dx0*sinZ + dy0*cosZ;
    if(s===0) pctx.moveTo(x,y); else pctx.lineTo(x,y);
  }
  pctx.strokeStyle = 'rgba(255,255,255,0.55)';
  pctx.lineWidth = Math.max(1, R*0.006);
  pctx.stroke();
}
function drawMoons(cx,cy,R,front){
  for(const m of state.moons){
    const squish = Math.sin(m.orbitTiltDeg*Math.PI/180);
    const zR = m.zTiltDeg*Math.PI/180;
    const cosZ=Math.cos(zR), sinZ=Math.sin(zR);
    const a = m.phase;
    const behind = Math.sin(a) < 0;
    if(behind === front) continue;
    const orbR = R*m.dist;
    const dx0 = Math.cos(a)*orbR;
    const dy0 = Math.sin(a)*orbR*squish;
    const x = cx + dx0*cosZ - dy0*sinZ;
    const y = cy + dx0*sinZ + dy0*cosZ;
    const mr = R*m.size;
    const tint = hslToRgb(m.hue, 0.22, 0.62);
    pctx.fillStyle = rgbCss(tint);
    pctx.beginPath(); pctx.arc(x,y,mr,0,Math.PI*2); pctx.fill();
    pctx.fillStyle = 'rgba(0,0,0,0.35)';
    pctx.beginPath(); pctx.arc(x-mr*0.3,y-mr*0.2,mr*0.22,0,Math.PI*2); pctx.fill();
  }
}
function drawClouds(cx,cy,R,rot,alpha){
  if(alpha<=0.01) return;
  const cosR=Math.cos(rot), sinR=Math.sin(rot);
  const tiltR = state.axisTiltDeg*Math.PI/180;
  const cosT=Math.cos(tiltR), sinT=Math.sin(tiltR);
  const unit = Math.max(1, (R*2/N));
  const snap = v => Math.round(v/unit)*unit;
  for(const cl of state.clouds){
    const px=cl.p[0], py=cl.p[1], pz=cl.p[2];
    const vx0 = px*cosR - pz*sinR;
    const vy0 = py;
    const vz = px*sinR + pz*cosR;
    const vx = vx0*cosT + vy0*sinT;
    const vy = -vx0*sinT + vy0*cosT;
    if(vz < -0.3) continue;
    const raw = vx*LIGHT[0]+vy*LIGHT[1]+vz*LIGHT[2];
    const day = dayFactorOf(raw);
    const tone = mixC(CLOUD_NIGHT, CLOUD_DAY, smoothstep(0.3,0.7,day));
    const sx = cx + vx*R, sy = cy + vy*R;
    for(const part of cl.parts){
      const w = snap(part.r*R*cl.size*2);
      const px2 = snap(sx + part.dx*R*cl.size - w/2);
      const py2 = snap(sy + part.dy*R*cl.size - w/2);
      pctx.fillStyle = rgbaCss(tone, alpha);
      pctx.fillRect(px2, py2, w, w);
    }
  }
}

function currentR(){
  return Math.min(planetCanvas.width, planetCanvas.height)*0.19;
}
function drawPixelBit(ctx,x,y,size,shape,colorCss,alpha){
  ctx.fillStyle = alpha===undefined ? colorCss : colorCss.replace(')', `,${alpha})`).replace('rgb(','rgba(');
  if(shape===0){
    ctx.fillRect(x-size/2,y-size/2,size,size);
  } else {
    const arm=size*0.42;
    ctx.fillRect(x-arm/2,y-size/2,arm,size);
    ctx.fillRect(x-size/2,y-arm/2,size,arm);
  }
}
function spawnMeteor(){
  const W = meteorCanvas.width, H = meteorCanvas.height;
  const cx0=W/2, cy0=H/2;
  const R = currentR();
  const halfDiag = Math.hypot(W,H)/2;
  const angle = Math.random()*Math.PI*2;
  const perp = angle+Math.PI/2;
  const offset = (Math.random()-0.5)*halfDiag*1.8;
  const dist = halfDiag*1.3;
  const sx = cx0+Math.cos(perp)*offset-Math.cos(angle)*dist;
  const sy = cy0+Math.sin(perp)*offset-Math.sin(angle)*dist;
  const ex = cx0+Math.cos(perp)*offset+Math.cos(angle)*dist;
  const ey = cy0+Math.sin(perp)*offset+Math.sin(angle)*dist;
  const duration = 6.0+Math.random()*3.0;
  const baseR = R*(0.014+Math.random()*0.026);
  const hue = Math.random()*360;
  const rockColor = hslToRgb(hue, 0.22+Math.random()*0.3, 0.42+Math.random()*0.28);
  const highlightColor = hslToRgb(hue, 0.2+Math.random()*0.2, 0.7);
  const verts=[]; const vCount=6+Math.floor(Math.random()*4);
  for(let i=0;i<vCount;i++){
    const a=(i/vCount)*Math.PI*2;
    const rr=0.62+Math.random()*0.48;
    verts.push([Math.cos(a)*rr, Math.sin(a)*rr]);
  }
  state.meteors.push({ sx,sy,ex,ey, t:0, duration, baseR, rockColor, highlightColor, verts, trail:[], spin:Math.random()*Math.PI*2, spinSpeed:(Math.random()-0.5)*4 });
}
function updateMeteors(dt){
  for(let k=state.meteors.length-1;k>=0;k--){
    const m = state.meteors[k];
    m.t += dt;
    if(m.t>=m.duration){ state.meteors.splice(k,1); continue; }
    const tt = m.t/m.duration;
    const x = m.sx+(m.ex-m.sx)*tt, y = m.sy+(m.ey-m.sy)*tt;
    const grains=[];
    const gCount = 2+Math.floor(Math.random()*2);
    for(let g=0;g<gCount;g++){
      grains.push({ dx:(Math.random()-0.5)*m.baseR*1.6, dy:(Math.random()-0.5)*m.baseR*1.6, size:m.baseR*(0.3+Math.random()*0.45), shape: Math.random()<0.3?1:0 });
    }
    m.trail.push({x,y,age:0,grains});
    for(const p of m.trail) p.age += dt;
    while(m.trail.length && m.trail[0].age > 0.85) m.trail.shift();
    m.spin += m.spinSpeed*dt;
    m.curX=x; m.curY=y;
  }
}
function drawMeteors(){
  mctx.clearRect(0,0,meteorCanvas.width,meteorCanvas.height);
  for(const m of state.meteors){
    if(m.curX===undefined) continue;
    for(let i=0;i<m.trail.length;i++){
      const p = m.trail[i];
      const lifeT = 1 - p.age/0.85;
      if(lifeT<=0) continue;
      for(const g of p.grains){
        drawPixelBit(mctx, p.x+g.dx, p.y+g.dy, g.size*(0.4+0.6*lifeT), g.shape, 'rgb(255,255,255)', 0.55*lifeT);
      }
    }
    const grad = mctx.createRadialGradient(m.curX,m.curY,0,m.curX,m.curY,m.baseR*3.2);
    grad.addColorStop(0,'rgba(255,255,255,0.55)');
    grad.addColorStop(0.4,'rgba(255,255,255,0.18)');
    grad.addColorStop(1,'rgba(255,255,255,0)');
    mctx.fillStyle = grad;
    mctx.beginPath(); mctx.arc(m.curX,m.curY,m.baseR*3.2,0,Math.PI*2); mctx.fill();
    mctx.save();
    mctx.translate(m.curX,m.curY);
    mctx.rotate(m.spin);
    mctx.beginPath();
    m.verts.forEach((v,i)=>{
      const px=v[0]*m.baseR, py=v[1]*m.baseR;
      if(i===0) mctx.moveTo(px,py); else mctx.lineTo(px,py);
    });
    mctx.closePath();
    mctx.fillStyle = rgbCss(m.rockColor);
    mctx.fill();
    mctx.beginPath();
    mctx.arc(-m.baseR*0.25,-m.baseR*0.25,m.baseR*0.35,0,Math.PI*2);
    mctx.fillStyle = rgbCss(m.highlightColor);
    mctx.fill();
    mctx.restore();
  }
}

function render(){
  renderSphere();
  pctx.clearRect(0,0,planetCanvas.width,planetCanvas.height);
  const cx=planetCanvas.width/2, cy=planetCanvas.height/2;
  const sceneR = Math.min(planetCanvas.width, planetCanvas.height)*0.19;
  const R = sceneR*state.planetSizeMul;

  if(state.ringsEnabled) drawRings(cx,cy,sceneR,false);
  if(state.moonsEnabled) drawMoons(cx,cy,sceneR,false);

  pctx.imageSmoothingEnabled=false;
  pctx.drawImage(off,0,0,N,N, cx-R,cy-R,R*2,R*2);

  const cloudAlpha = smoothstep(2.0,3.0,state.stageAnim);
  drawClouds(cx,cy,R,state.rotation,cloudAlpha);

  if(state.ringsEnabled) drawRings(cx,cy,sceneR,true);
  if(state.moonsEnabled) drawMoons(cx,cy,sceneR,true);

  if(state.openMoonId){
    const m = state.moons.find(x=>x.id===state.openMoonId);
    if(m) drawMoonOrbit(cx,cy,sceneR,m);
  }
}

/* ============================= ANIMATION LOOP ============================= */
let lastT=0;
function frame(t){
  if(!lastT) lastT=t;
  const dt = Math.min(0.05,(t-lastT)/1000);
  lastT=t;

  state.rotation += dt*state.spinSpeed*state.spinDir;
  state.stageAnim += (state.stageTarget - state.stageAnim)*Math.min(1, dt*3.2);
  if(Math.abs(state.stageTarget-state.stageAnim)<0.002) state.stageAnim=state.stageTarget;
  for(const m of state.moons) m.phase += dt*m.speed*m.dir;
  for(const r of state.rings) r.phase += dt*r.speed*r.dir;
  updateMeteors(dt);

  drawStarfield(t/1000);
  render();
  if(document.body.classList.contains('focus-mode')) drawMeteors();
  requestAnimationFrame(frame);
}

/* ============================= STARFIELD (static) ============================= */
const starCanvas = document.getElementById('starfield');
const starCtx = starCanvas.getContext('2d');
let stars = [];
function initStarfield(){
  const dpr = Math.min(2, window.devicePixelRatio||1);
  starCanvas.width = window.innerWidth*dpr;
  starCanvas.height = window.innerHeight*dpr;
  starCanvas.style.width = window.innerWidth+'px';
  starCanvas.style.height = window.innerHeight+'px';
  const count = Math.floor((window.innerWidth*window.innerHeight)/9000);
  stars = [];
  for(let i=0;i<count;i++){
    stars.push({
      x: Math.random()*starCanvas.width,
      y: Math.random()*starCanvas.height,
      r: (Math.random()<0.8?4.5:9),
      baseAlpha: 0.15+Math.random()*0.55,
      phase: Math.random()*Math.PI*2,
      speed: 0.35+Math.random()*0.45,
      phase2: Math.random()*Math.PI*2,
      speed2: 1.5+Math.random()*4.5,
      sparkle: Math.random()*0.4+0.15
    });
  }
}
function drawStarfield(t){
  starCtx.fillStyle='#0a0b12';
  starCtx.fillRect(0,0,starCanvas.width,starCanvas.height);
  for(const s of stars){
    const slow = 0.55+0.45*Math.sin(t*s.speed+s.phase);
    const sparkle = 1 - s.sparkle*(0.5+0.5*Math.sin(t*s.speed2+s.phase2));
    const tw = slow*sparkle;
    starCtx.fillStyle = `rgba(255,255,255,${(s.baseAlpha*tw).toFixed(3)})`;
    starCtx.fillRect(s.x, s.y, s.r, s.r);
  }
}

/* ============================= UI: MOONS & RINGS LIST ============================= */
function fieldRow(labelText, min, max, step, value, onInput, isHue, unitSuffix){
  const wrap = document.createElement('div'); wrap.className='field';
  const lab = document.createElement('div'); lab.className='field-label';
  const l1 = document.createElement('span'); l1.textContent=labelText;
  const l2 = document.createElement('span');
  l2.textContent = (isHue? Math.round(value) : parseFloat(value).toFixed(2)) + (unitSuffix||'');
  lab.appendChild(l1); lab.appendChild(l2);
  const inp = document.createElement('input');
  inp.type='range'; inp.min=min; inp.max=max; inp.step=step; inp.value=value;
  if(isHue) inp.classList.add('hue-slider');
  inp.addEventListener('input', ()=>{
    const v = parseFloat(inp.value);
    l2.textContent = (isHue? Math.round(v) : v.toFixed(2)) + (unitSuffix||'');
    onInput(v);
  });
  wrap.appendChild(lab); wrap.appendChild(inp);
  return wrap;
}
function dirRow(current, onChange){
  const wrap = document.createElement('div'); wrap.className='dir-row';
  const cw = document.createElement('div'); cw.className='dir-btn'+(current===1?' active':''); cw.textContent='⟳ CW';
  const ccw = document.createElement('div'); ccw.className='dir-btn'+(current===-1?' active':''); ccw.textContent='⟲ CCW';
  cw.addEventListener('click', ()=>{ onChange(1); cw.classList.add('active'); ccw.classList.remove('active'); });
  ccw.addEventListener('click', ()=>{ onChange(-1); ccw.classList.add('active'); cw.classList.remove('active'); });
  wrap.appendChild(cw); wrap.appendChild(ccw);
  return wrap;
}

function renderMoonList(){
  const list = document.getElementById('moonList');
  list.innerHTML='';
  document.getElementById('moonCount').textContent = state.moons.length;
  if(state.moons.length===0){
    const e = document.createElement('div'); e.className='empty-hint'; e.textContent='No moons yet — tap + to add';
    list.appendChild(e); return;
  }
  state.moons.forEach((m, idx)=>{
    const row = document.createElement('div'); row.className='item-row';
    const sw = document.createElement('div'); sw.className='swatch'; sw.style.background = rgbCss(hslToRgb(m.hue,0.6,0.6));
    const name = document.createElement('div'); name.className='item-name'; name.textContent = 'Moon '+(idx+1);
    const meta = document.createElement('div'); meta.className='item-meta'; meta.textContent = 'd '+m.dist.toFixed(2);
    const del = document.createElement('div'); del.className='item-del'; del.textContent='×';
    row.appendChild(sw); row.appendChild(name); row.appendChild(meta); row.appendChild(del);
    row.addEventListener('click', (ev)=>{ if(ev.target===del) return; state.openMoonId = state.openMoonId===m.id? null : m.id; renderMoonList(); });
    del.addEventListener('click', (ev)=>{ ev.stopPropagation(); state.moons = state.moons.filter(x=>x.id!==m.id); if(state.moons.length===0) state.moonsEnabled=false; renderMoonList(); syncMasterToggles(); });
    list.appendChild(row);

    if(state.openMoonId===m.id){
      const editor = document.createElement('div'); editor.className='item-editor';
      editor.appendChild(fieldRow('Distance', 1.15, 8.0, 0.05, m.dist, v=>m.dist=v));
      editor.appendChild(fieldRow('Size', 0.06, 0.24, 0.01, m.size, v=>m.size=v));
      editor.appendChild(fieldRow('Orbit speed', 0.02, 0.5, 0.01, m.speed, v=>m.speed=v));
      editor.appendChild(fieldRow('Orbit tilt (X-axis)', 0, 90, 1, m.orbitTiltDeg, v=>m.orbitTiltDeg=v, false, '°'));
      editor.appendChild(fieldRow('Orbit tilt (Z-axis)', -60, 60, 1, m.zTiltDeg, v=>m.zTiltDeg=v, false, '°'));
      editor.appendChild(fieldRow('Color', 0, 359, 1, m.hue, v=>{ m.hue=v; sw.style.background=rgbCss(hslToRgb(v,0.6,0.6)); }, true));
      editor.appendChild(dirRow(m.dir, v=>m.dir=v));
      list.appendChild(editor);
    }
  });
}

function renderRingList(){
  const list = document.getElementById('ringList');
  list.innerHTML='';
  document.getElementById('ringCount').textContent = state.rings.length;
  if(state.rings.length===0){
    const e = document.createElement('div'); e.className='empty-hint'; e.textContent='No rings yet — tap + to add';
    list.appendChild(e); return;
  }
  state.rings.forEach((r, idx)=>{
    const row = document.createElement('div'); row.className='item-row';
    const sw = document.createElement('div'); sw.className='swatch'; sw.style.background = rgbCss(hslToRgb(r.hue,0.35,0.6));
    const name = document.createElement('div'); name.className='item-name'; name.textContent = 'Ring '+(idx+1);
    const meta = document.createElement('div'); meta.className='item-meta'; meta.textContent = 'd '+r.dist.toFixed(2);
    const del = document.createElement('div'); del.className='item-del'; del.textContent='×';
    row.appendChild(sw); row.appendChild(name); row.appendChild(meta); row.appendChild(del);
    row.addEventListener('click', (ev)=>{ if(ev.target===del) return; state.openRingId = state.openRingId===r.id? null : r.id; renderRingList(); });
    del.addEventListener('click', (ev)=>{ ev.stopPropagation(); state.rings = state.rings.filter(x=>x.id!==r.id); if(state.rings.length===0) state.ringsEnabled=false; renderRingList(); syncMasterToggles(); });
    list.appendChild(row);

    if(state.openRingId===r.id){
      const editor = document.createElement('div'); editor.className='item-editor';
      editor.appendChild(fieldRow('Distance', 1.1, 6.0, 0.05, r.dist, v=>r.dist=v));
      editor.appendChild(fieldRow('Thickness', 0.05, 0.7, 0.01, r.width, v=>r.width=v));
      editor.appendChild(fieldRow('Asteroid density', 0.3, 6.0, 0.1, r.density, v=>{ r.density=v; regenerateRingParticles(r); }));
      editor.appendChild(fieldRow('Orbit speed', 0.01, 0.4, 0.01, r.speed, v=>r.speed=v));
      editor.appendChild(fieldRow('Orbit tilt (X-axis)', 0, 90, 1, r.orbitTiltDeg, v=>r.orbitTiltDeg=v, false, '°'));
      editor.appendChild(fieldRow('Orbit tilt (Z-axis)', -60, 60, 1, r.zTiltDeg, v=>r.zTiltDeg=v, false, '°'));
      editor.appendChild(fieldRow('Color', 0, 359, 1, r.hue, v=>{ r.hue=v; sw.style.background=rgbCss(hslToRgb(v,0.35,0.6)); }, true));
      editor.appendChild(dirRow(r.dir, v=>r.dir=v));
      list.appendChild(editor);
    }
  });
}

function renderPlanetPanel(){
  const editor = document.getElementById('planetEditor');
  editor.innerHTML='';
  editor.appendChild(fieldRow('Size', 0.7, 1.3, 0.05, state.planetSizeMul, v=>state.planetSizeMul=v));
  editor.appendChild(fieldRow('Spin speed', 0.0, 0.35, 0.01, state.spinSpeed, v=>state.spinSpeed=v));
  editor.appendChild(dirRow(state.spinDir, v=>state.spinDir=v));
  editor.appendChild(fieldRow('Axial tilt', -45, 45, 1, state.axisTiltDeg, v=>state.axisTiltDeg=v, false, '°'));
  editor.appendChild(fieldRow('Cloud density', 0.0, 2.5, 0.1, state.cloudDensityMul, v=>{ state.cloudDensityMul=v; regenerateClouds(); }));
  editor.appendChild(fieldRow('Water color', 0, 359, 1, state.pal.waterHue, v=>{ state.pal.waterHue=v; rebuildPalette(v, state.pal.landHue, state.pal.seaLevel); }, true));
  editor.appendChild(fieldRow('Land color', 0, 359, 1, state.pal.landHue, v=>{ state.pal.landHue=v; rebuildPalette(state.pal.waterHue, v, state.pal.seaLevel); }, true));
  editor.appendChild(fieldRow('Sea level', 0.05, 0.75, 0.01, state.pal.seaLevel, v=>{ state.pal.seaLevel=v; rebuildPalette(state.pal.waterHue, state.pal.landHue, v); }));
}
document.getElementById('planetPanelHead').addEventListener('click', ()=>{
  state.planetPanelOpen = !state.planetPanelOpen;
  const editor = document.getElementById('planetEditor');
  const chev = document.getElementById('planetChevron');
  if(state.planetPanelOpen){ renderPlanetPanel(); editor.style.display='flex'; chev.textContent='▴'; }
  else { editor.style.display='none'; chev.textContent='▾'; }
});

function syncMasterToggles(){
  document.getElementById('moonMasterToggle').classList.toggle('on', state.moonsEnabled);
  document.getElementById('ringMasterToggle').classList.toggle('on', state.ringsEnabled);
}
function syncUI(){ renderMoonList(); renderRingList(); syncMasterToggles(); if(state.planetPanelOpen) renderPlanetPanel(); }
function updateStageLabel(){
  const idx = Math.round(state.stageTarget);
  document.getElementById('stageName').textContent = STAGE_NAMES[idx][0];
  document.getElementById('stageSub').textContent = STAGE_NAMES[idx][1];
}

/* ============================= EVENT WIRING ============================= */
document.querySelectorAll('.stage-tab').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.stage-tab').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    state.stageTarget = parseInt(btn.dataset.stage,10);
    updateStageLabel();
  });
});

document.getElementById('moonMasterToggle').addEventListener('click', ()=>{ state.moonsEnabled = !state.moonsEnabled; syncMasterToggles(); });
document.getElementById('ringMasterToggle').addEventListener('click', ()=>{ state.ringsEnabled = !state.ringsEnabled; syncMasterToggles(); });

document.getElementById('addMoonBtn').addEventListener('click', ()=>{
  const rnd = ()=>Math.random();
  const m = makeMoon(rnd, 1.3+Math.random()*0.6);
  state.moons.push(m);
  state.moonsEnabled = true;
  state.openMoonId = m.id;
  renderMoonList(); syncMasterToggles();
});
document.getElementById('addRingBtn').addEventListener('click', ()=>{
  const rnd = ()=>Math.random();
  const r = makeRing(rnd, 1.3+Math.random()*0.5);
  state.rings.push(r);
  state.ringsEnabled = true;
  state.openRingId = r.id;
  renderRingList(); syncMasterToggles();
});

const seedInput = document.getElementById('seedInput');
function applySeed(){
  const v = seedInput.value.trim();
  generatePlanet(v.length? v : randomSeedName());
}
seedInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ seedInput.blur(); applySeed(); } });
seedInput.addEventListener('blur', ()=>{ if(seedInput.value.trim().length) applySeed(); });

document.getElementById('randomBtn').addEventListener('click', ()=>{
  const name = randomSeedName();
  seedInput.value = name;
  generatePlanet(name);
});

document.getElementById('meteorBtn').addEventListener('click', ()=>{ spawnMeteor(); });

document.getElementById('zoomSlider').addEventListener('input', (e)=>{
  const v = parseInt(e.target.value,10);
  document.getElementById('zoomValue').textContent = v+'%';
  state.zoomScale = v/100;
  planetCanvas.style.transform = `scale(${state.zoomScale})`;
});

document.getElementById('focusToggleBtn').addEventListener('click', ()=>{
  document.body.classList.add('focus-mode');
  document.getElementById('zoomSlider').value = 100;
  document.getElementById('zoomValue').textContent = '100%';
  state.zoomScale = 1;
  planetCanvas.style.transform = 'scale(1)';
  requestAnimationFrame(()=>{ resizeCanvas(); resizeMeteorCanvas(); });
});
document.getElementById('exitFocusBtn').addEventListener('click', ()=>{
  document.body.classList.remove('focus-mode');
  state.zoomScale = 1;
  planetCanvas.style.transform = 'scale(1)';
  state.meteors = [];
  requestAnimationFrame(()=>{ resizeCanvas(); resizeMeteorCanvas(); });
});

window.addEventListener('resize', ()=>{ initStarfield(); resizeCanvas(); resizeMeteorCanvas(); });

/* ============================= INIT ============================= */
initStarfield();
resizeCanvas();
resizeMeteorCanvas();
const initialName = randomSeedName();
seedInput.value = initialName;
generatePlanet(initialName);
updateStageLabel();
requestAnimationFrame(frame);
</script>
</body>
